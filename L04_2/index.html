<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Top 5 Feature Selection Suite // 8 ML Datasets (Python / Streamlit)</title>
  <meta name="description" content="100% Pure Python Streamlit 互動式特徵選擇演算法分析與評估系統 - 支援 8 大機器學習迴歸資料集 - WebAssembly 部署於 GitHub Pages">

  <!-- Stlite CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.72.0/build/stlite.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e1117;
    }
  </style>
</head>
<body>
  <!-- Stlite Mount Target -->
  <div id="root"></div>

  <!-- Stlite JavaScript Loader -->
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.72.0/build/stlite.js"></script>

  <script>
    stlite.mount({
      requirements: ["pandas", "numpy", "scikit-learn", "matplotlib", "scipy"],
      entrypoint: "app.py",
      files: {
        "app.py": {
          url: "./app.py"
        },
        "all_datasets_precomputed.json": {
          url: "./all_datasets_precomputed.json"
        },
        "data/accident_risk.csv": {
          url: "./data/accident_risk.csv"
        },
        "data/kc_house_sales.csv": {
          url: "./data/kc_house_sales.csv"
        },
        "data/spotify_tracks.csv": {
          url: "./data/spotify_tracks.csv"
        },
        "data/laptop_price.csv": {
          url: "./data/laptop_price.csv"
        },
        "data/bike_sharing.csv": {
          url: "./data/bike_sharing.csv"
        },
        "data/used_car_price.csv": {
          url: "./data/used_car_price.csv"
        },
        "data/house_rent.csv": {
          url: "./data/house_rent.csv"
        },
        "data/flight_ticket_price.csv": {
          url: "./data/flight_ticket_price.csv"
        }
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
