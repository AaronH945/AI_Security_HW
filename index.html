<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Security Course Portfolio - 黃偉倫 Aaron Huang (511405009) with real-time Taipei clock.">
  <title>黃偉倫 Aaron Huang | AI Security Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>

  <main class="container">
    <div class="card" id="profile-card">
      <!-- Top Status Header -->
      <header class="card-header">
        <div class="status-badge" id="live-indicator">
          <span class="pulse-dot"></span>
          <span class="badge-text">TAIPEI TIME (UTC+8)</span>
        </div>
        <div class="theme-controls" id="theme-controls" title="Toggle Accent Color">
          <button class="theme-dot active" data-theme="cyan" id="btn-theme-cyan" aria-label="Cyan theme"></button>
          <button class="theme-dot" data-theme="purple" id="btn-theme-purple" aria-label="Purple theme"></button>
          <button class="theme-dot" data-theme="emerald" id="btn-theme-emerald" aria-label="Emerald theme"></button>
          <button class="theme-dot" data-theme="amber" id="btn-theme-amber" aria-label="Amber theme"></button>
        </div>
      </header>

      <!-- Student Profile Section -->
      <section class="profile-section" id="profile-section">
        <div class="avatar-ring">
          <div class="avatar-inner">
            <span class="avatar-initials">AH</span>
          </div>
        </div>

        <div class="profile-info">
          <div class="course-tag">AI Security Coursework</div>
          <h1 class="user-name" id="user-name">黃偉倫 <span class="name-en">Aaron Huang</span></h1>
          <div class="student-id-badge" id="student-id">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <span>學號 / Student ID: <strong>511405009</strong></span>
          </div>
        </div>
      </section>

      <hr class="divider">

      <!-- Taipei Clock Display Section -->
      <section class="clock-section" id="clock-section">
        <div class="clock-label-row">
          <span class="clock-subheading">現在標準時間 / Present Time</span>
          <button class="format-toggle-btn" id="format-toggle-btn" aria-label="Toggle 12/24 hour format">
            <span id="format-label">24H</span>
          </button>
        </div>

        <!-- Main Digital Display -->
        <div class="digital-clock" id="digital-clock">
          <div class="time-segment" id="seg-hours">
            <span class="time-digit" id="clock-hours">00</span>
            <span class="time-unit">HOURS</span>
          </div>
          <span class="time-colon">:</span>
          <div class="time-segment" id="seg-minutes">
            <span class="time-digit" id="clock-minutes">00</span>
            <span class="time-unit">MINS</span>
          </div>
          <span class="time-colon">:</span>
          <div class="time-segment" id="seg-seconds">
            <span class="time-digit" id="clock-seconds">00</span>
            <span class="time-unit">SECS</span>
          </div>
          <div class="time-ampm" id="clock-ampm" style="display: none;">AM</div>
        </div>

        <!-- Date & Location Information -->
        <div class="date-container" id="date-container">
          <div class="date-row">
            <svg class="icon-date" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="date-text" id="clock-date">2026年9月14日 星期一</span>
          </div>
          <div class="timezone-chip" id="timezone-chip">
            <svg class="icon-globe" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span>Taipei, Taiwan (CST / GMT+8)</span>
          </div>
        </div>

        <!-- Seconds Progress Bar -->
        <div class="progress-bar-container" title="Current minute progress">
          <div class="progress-bar-fill" id="seconds-progress"></div>
        </div>
      </section>

      <!-- Action Footer -->
      <footer class="card-footer">
        <a href="https://github.com/AaronH945/AI_Security_HW" target="_blank" rel="noopener noreferrer" class="btn btn-github" id="btn-github">
          <svg class="icon-github" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub Repository</span>
        </a>
        <button class="btn btn-copy" id="btn-copy-time">
          <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-text">複製時間</span>
        </button>
      </footer>
    </div>
  </main>

  <div id="toast" class="toast">已複製台北時間至剪貼簿！</div>

  <script src="app.js"></script>
</body>
</html>
