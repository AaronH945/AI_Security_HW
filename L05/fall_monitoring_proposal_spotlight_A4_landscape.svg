<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1400 990">
<style>
  .title{font:700 36px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#fff}
  .subtitle{font:600 16px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#dbeafe}
  .ptitle{font:700 21px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#fff}
  .num{font:800 20px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#fff}
  .h{font:700 18px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#0f172a}
  .body{font:500 15px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#1f2937}
  .small{font:500 13px "Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#334155}
